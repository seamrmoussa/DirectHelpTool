<div class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <div class="w-full max-w-xl rounded-2xl bg-[#10131A] p-8 shadow-2xl">
    <h2 class="text-xl font-bold text-[#EFF0F2] mb-2">Find what you're looking for</h2>

    <p class="text-sm text-gray-400 mb-6">Search across your workspace</p>

    <div class="flex flex-col sm:flex-row gap-3">
      <div
        class="flex flex-1 items-center gap-3 rounded-xl border border-gray-700 bg-[#1B202A] px-4 transition-all duration-300 focus-within:border-[#2EB2D3] focus-within:ring-2 focus-within:ring-[#2EB2D3]/20"
      >
        <svg
          class="w-5 h-5 text-gray-400 shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <circle cx="11" cy="11" r="8" stroke-width="2" />
          <path d="m21 21-4.35-4.35" stroke-width="2" stroke-linecap="round" />
        </svg>

        <input
          type="text"
          placeholder="Type something..."
          class="w-full bg-transparent py-3 text-white outline-none placeholder:text-gray-500"
        />
      </div>

      <button
        type="button"
        class="flex items-center justify-center gap-2 rounded-xl bg-[#2EB2D3] px-6 py-3 font-semibold text-[#10131A] transition-all duration-300 hover:bg-[#239bb9] hover:shadow-lg hover:shadow-[#2EB2D3]/20 active:scale-95"
      >
        <span>Search</span>

        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </div>
</div>
