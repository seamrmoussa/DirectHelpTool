<div class="w-full max-w-2xl rounded-xl border border-slate-200 bg-white p-5 shadow-sm" dir="rtl">
  <label for="tokenInput" class="mb-2 block text-sm font-semibold text-slate-800">
    توكن المصادقة (Authorization Token)
  </label>

  <div class="flex flex-col gap-3 sm:flex-row">
    <input
      id="tokenInput"
      type="text"
      dir="ltr"
      [value]="token()"
      (input)="onTokenInput($event)"
      placeholder="التوكن هيظهر هنا تلقائياً بدون Bearer..."
      class="flex-1 rounded-lg border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-sky-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-600/20"
    />

    <button
      type="button"
      [disabled]="isLoading()"
      (click)="fetchTokenFromExtension()"
      class="inline-flex items-center justify-center gap-2 rounded-lg bg-sky-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-800 disabled:cursor-not-allowed disabled:opacity-60"
    >
      <i class="fa-solid fa-rotate" [class.fa-spin]="isLoading()"></i>
      <span>{{ isLoading() ? 'جاري السحب...' : 'جلب التوكن تلقائياً' }}</span>
    </button>
  </div>

  @if (statusMessage()) {
    <p
      class="mt-3 rounded-lg border px-3 py-2 text-xs font-medium"
      [class.border-red-200]="isError()"
      [class.bg-red-50]="isError()"
      [class.text-red-700]="isError()"
      [class.border-emerald-200]="!isError()"
      [class.bg-emerald-50]="!isError()"
      [class.text-emerald-700]="!isError()"
    >
      {{ statusMessage() }}
    </p>
  }
</div>
