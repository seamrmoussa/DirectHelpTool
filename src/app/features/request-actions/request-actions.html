<div class="min-h-screen w-full bg-slate-50 px-4 py-5 text-slate-800" dir="ltr">
  <a
    href="https://drive.usercontent.google.com/download?id=15MvKzkdNTPe3sMq-24upDGDfIkygkGqC&export=download&authuser=1&confirm=t&uuid=3d080dca-4b60-498b-96df-df6baded2bb9&at=AMrWOn3wWlZMEf0mZ4riQxlqvJmX:1795604552942"
    class="mx-auto mb-5 flex w-fit cursor-pointer items-center justify-center gap-2 rounded-xl border border-green-200 bg-green-50 px-4 py-2.5 text-xs font-bold text-green-800 shadow-2xs transition hover:border-green-300 hover:bg-green-100"
  >
    <i class="fa-solid fa-download text-green-600"></i>
    <span>Download Tool</span>
  </a>
  <div class="mx-auto flex w-full max-w-2xl flex-col gap-6">
    <!-- Header Bar & Permission Action -->
    <div
      class="flex flex-col items-start justify-between gap-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:flex-row sm:items-center"
    >
      <div class="flex items-center gap-3.5">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-xl bg-sky-50 text-sky-600 ring-1 ring-sky-200/70"
        >
          <i class="fa-solid fa-screwdriver-wrench text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-slate-900">
            Document Checks Help Tool
          </h1>
          <p class="text-xs font-medium text-slate-500">
            Sync session token &amp; batch-process document checks
          </p>
        </div>
      </div>

      <button
        type="button"
        [disabled]="isFetchingToken()"
        (click)="fetchTokenFromExtension()"
        class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl border border-amber-200 bg-amber-50 px-4 py-2.5 text-xs font-bold text-amber-800 shadow-2xs transition hover:border-amber-300 hover:bg-amber-100 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <i class="fa-solid fa-key text-amber-600" [class.fa-spin]="isFetchingToken()"></i>
        <span>{{ isFetchingToken() ? 'Connecting...' : 'Get permission' }}</span>
      </button>
    </div>

    <!-- Batch Range & Execution Card -->
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">
          1. Batch Queue Processing
        </span>
        <span
          class="rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-semibold text-slate-600"
        >
          doc-check-upcoming
        </span>
      </div>

      <!-- Two Date inputs: From & To -->
      <div class="grid w-full grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="fromDate" class="text-xs font-semibold text-slate-600">From Date</label>
          <input
            id="fromDate"
            type="date"
            [value]="fromDate()"
            (change)="onFromDateChange($event)"
            class="w-full rounded-xl border border-slate-300 bg-slate-50/70 px-3.5 py-2.5 text-sm font-medium text-slate-800 transition focus:border-sky-500 focus:bg-white focus:ring-3 focus:ring-sky-500/15 focus:outline-none"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="toDate" class="text-xs font-semibold text-slate-600">To Date</label>
          <input
            id="toDate"
            type="date"
            [value]="toDate()"
            (change)="onToDateChange($event)"
            class="w-full rounded-xl border border-slate-300 bg-slate-50/70 px-3.5 py-2.5 text-sm font-medium text-slate-800 transition focus:border-sky-500 focus:bg-white focus:ring-3 focus:ring-sky-500/15 focus:outline-none"
          />
        </div>
      </div>

      <!-- Primary Action Buttons -->
      <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2">
        <button
          type="button"
          (click)="sendGetRequest()"
          class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white shadow-xs transition hover:bg-sky-700 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50"
        >
          <i class="fa-solid fa-cloud-arrow-down text-xs"></i>
          <span>Get All Requests</span>
        </button>

        <button
          type="button"
          [disabled]="isRunningBatch()"
          (click)="runFirstActionOnAllOrders()"
          class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white shadow-xs transition hover:bg-emerald-700 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50"
        >
          <i
            class="fa-solid text-xs"
            [class.fa-circle-check]="!isRunningBatch()"
            [class.fa-spinner]="isRunningBatch()"
            [class.fa-spin]="isRunningBatch()"
          ></i>
          <span>{{ isRunningBatch() ? 'Processing...' : 'Done All' }}</span>
        </button>
      </div>
    </div>

    <!-- Status feedback banner -->
    @if (statusMessage()) {
      <div
        class="flex items-center justify-center gap-2.5 rounded-xl border px-4 py-3.5 text-center text-xs font-semibold shadow-2xs"
        [class.border-rose-200]="isError()"
        [class.bg-rose-50]="isError()"
        [class.text-rose-700]="isError()"
        [class.border-emerald-200]="!isError()"
        [class.bg-emerald-50/80]="!isError()"
        [class.text-emerald-800]="!isError()"
      >
        <i
          class="fa-solid text-sm"
          [class.fa-circle-exclamation]="isError()"
          [class.fa-circle-info]="!isError()"
        ></i>
        <span>{{ statusMessage() }}</span>
      </div>
    }

    <!-- Single Track Number input + Action Card -->
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">
          2. Single Application
        </span>
        <span
          class="rounded-full bg-indigo-50 px-2.5 py-0.5 text-[11px] font-semibold text-indigo-700"
        >
          Done 7 Actions
        </span>
      </div>

      <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
        <div class="flex flex-1 flex-col gap-1.5">
          <label for="trackNumberInput" class="text-xs font-semibold text-slate-600">
            Track Number
          </label>
          <input
            id="trackNumberInput"
            type="text"
            [value]="searchTrackNumber()"
            (input)="onTrackNumberInput($event)"
            placeholder="50358893"
            class="w-full rounded-xl border border-slate-300 bg-slate-50/70 px-3.5 py-2.5 text-sm font-medium text-slate-800 placeholder-slate-400 transition focus:border-indigo-500 focus:bg-white focus:ring-3 focus:ring-indigo-500/15 focus:outline-none"
          />
        </div>

        <button
          type="button"
          [disabled]="isRunningSingleOrder()"
          (click)="runAllSevenDocsForOrder()"
          class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-xs transition hover:bg-indigo-700 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50 sm:min-w-52"
        >
          <i
            class="fa-solid text-xs"
            [class.fa-list-check]="!isRunningSingleOrder()"
            [class.fa-spinner]="isRunningSingleOrder()"
            [class.fa-spin]="isRunningSingleOrder()"
          ></i>
          <span>{{
            isRunningSingleOrder() ? 'Executing all actions...' : 'Complete all actions'
          }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
